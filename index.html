      * {

      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", sans-serif;
        background: radial-gradient(circle at top, #1e293b, #0f172a);
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: rgba(30, 41, 59, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 20px;
        padding: 28px;
        max-width: 440px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      }

      .badge {
        display: inline-block;
        background: #3b82f6;
        color: white;
        font-size: 11px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 999px;
        letter-spacing: 0.08em;
        margin-bottom: 12px;
      }

      .main-header {
        margin-bottom: 20px;
      }

      .app-title {
        font-size: 20px;
        font-weight: 700;
        color: #ffffff;
        margin: 0;
      }

      .category-section {
        text-align: left;
        background: rgba(15, 23, 42, 0.5);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 16px;
      }

      .category-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        cursor: pointer;
      }

      .category-header h3 {
        font-size: 15px;
        font-weight: 700;
        color: #38bdf8;
        margin: 0;
      }

      .category-header:hover h3 {
        text-decoration: underline;
      }

      .app-count {
        font-size: 12px;
        color: #94a3b8;
      }

      .app-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .app-item {
        background: rgba(30, 41, 59, 0.6);
        border: 1px solid rgba(148, 163, 184, 0.1);
        padding: 10px 14px;
        border-radius: 10px;
        transition: background 0.2s;
        cursor: pointer;
        text-decoration: none;
        display: block;
      }

      .app-item:hover {
        background: rgba(51, 65, 85, 0.8);
      }

      .app-info h4 {
        font-size: 14px;
        font-weight: 600;
        color: #f1f5f9;
        margin: 0 0 2px 0;
      }

      .app-info p {
        font-size: 12px;
        color: #94a3b8;
        margin: 0;
      }

      button {
        margin-top: 8px;
        width: 100%;
        background: #10b981;
        color: #052e16;
        border: none;
        padding: 12px 22px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.2s;
      }

      button:hover {
        opacity: 0.9;
      }

      /* Phần Footer */
      .main-footer {
        margin-top: 20px;
        border-top: 1px solid rgba(148, 163, 184, 0.15);
        padding-top: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 12px;
        color: #94a3b8;
      }

      .footer-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .footer-links {
        display: flex;
        gap: 12px;
      }

      .footer-links a {
        color: #38bdf8;
        text-decoration: none;
        font-weight: 600;
      }

      .footer-links a:hover {
        text-decoration: underline;
      }

    </style>
